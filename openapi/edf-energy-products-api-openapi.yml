components:
  schemas:
    GasTariff:
      type: object
      properties:
        code:
          type: string
          maxLength: 255
        standing_charge_exc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        standing_charge_inc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        online_discount_exc_vat:
          type: integer
          readOnly: true
        online_discount_inc_vat:
          type: number
          format: double
          readOnly: true
        dual_fuel_discount_exc_vat:
          type: integer
          readOnly: true
        dual_fuel_discount_inc_vat:
          type: number
          format: double
          readOnly: true
        exit_fees_exc_vat:
          type: integer
          readOnly: true
        exit_fees_inc_vat:
          type: integer
          readOnly: true
        exit_fees_type:
          type: string
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
        standard_unit_rate_exc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        standard_unit_rate_inc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
      required:
      - code
      - dual_fuel_discount_exc_vat
      - dual_fuel_discount_inc_vat
      - exit_fees_exc_vat
      - exit_fees_inc_vat
      - exit_fees_type
      - links
      - online_discount_exc_vat
      - online_discount_inc_vat
      - standard_unit_rate_exc_vat
      - standard_unit_rate_inc_vat
      - standing_charge_exc_vat
      - standing_charge_inc_vat
    FourRateEvElectricityTariff:
      type: object
      properties:
        code:
          type: string
          maxLength: 255
        standing_charge_exc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        standing_charge_inc_vat:
