          readOnly: true
        exit_fees_type:
          type: string
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
      required:
      - code
      - dual_fuel_discount_exc_vat
      - dual_fuel_discount_inc_vat
      - exit_fees_exc_vat
      - exit_fees_inc_vat
      - exit_fees_type
      - links
      - online_discount_exc_vat
      - online_discount_inc_vat
      - standing_charge_exc_vat
      - standing_charge_inc_vat
    SampleConsumption:
      type: object
      properties:
        electricity_single_rate:
          type: object
          additionalProperties:
            type: integer
          title: Consumption type
        electricity_dual_rate:
          type: object
          additionalProperties:
            type: integer
          title: Consumption type
        dual_fuel_single_rate:
          type: object
          additionalProperties:
            type: integer
          title: Consumption type
        dual_fuel_dual_rate:
          type: object
          additionalProperties:
            type: integer
          title: Consumption type
      required:
      - dual_fuel_dual_rate
      - dual_fuel_single_rate
      - electricity_dual_rate
      - electricity_single_rate
    PaginatedProductsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: https://api.edfgb-kraken.energy/v1/products/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: https://api.edfgb-kraken.energy/v1/products/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Products'
    Link:
      type: object
      properties:
        href:
          type: string
        method:
          type: string
        rel:
          type: string
      required:
      - href
      - method
      - rel
    Product:
      type: object
      properties:
        code:
          type: string
          maxLength: 128
        full_name:
          type: string
          maxLength: 255
        display_name:
          type: string
          description: This name will be shown to customers during sign-up
          maxLength: 255
        description:
          type: string
          description: This will be shown to customers during sign-up
        is_variable:
          type: boolean
          title: Is variable?
        is_green:
          type: boolean
          title: Is a green product?
        is_tracker:
          type: boolean
          title: Is a tracker product?
        is_prepay:
          type: boolean
        is_business:
          type: boolean
          title: Is a business product?
        is_restricted:
          type: boolean
          readOnly: true
        term:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Duration of agreements using this product in months
        available_from:
          type: string
          format: date-time
        available_to:
          type:
          - string
          - 'null'
          format: date-time
        tariffs_active_at:
          type: string
          format: date-time
          readOnly: true
        single_register_electricity_tariffs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              allOf:
              - $ref: '#/components/schemas/StandardElectricityTariff'
              description: Tariffs per payment method (DIRECT_DEBIT_MONTHLY, DIRECT_DEBIT_QUARTERLY, POROB, PREPAYMENT, VARYING)
            title: Payment methods per GSP's group id
          readOnly: true
        dual_register_electricity_tariffs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              allOf:
              - $ref: '#/components/schemas/Eco7ElectricityTariff'
              description: Tariffs per payment method (DIRECT_DEBIT_MONTHLY, DIRECT_DEBIT_QUARTERLY, POROB, PREPAYMENT, VARYING)
            title: Payment methods per GSP's group id
          readOnly: true
        four_rate_ev_electricity_tariffs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              allOf:
              - $ref: '#/components/schemas/FourRateEvElectricityTariff'
              description: Tariffs per payment method (DIRECT_DEBIT_MONTHLY, DIRECT_DEBIT_QUARTERLY, POROB, PREPAYMENT, VARYING)
            title: Payment methods per GSP's group id
          readOnly: true
        single_register_gas_tariffs:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              allOf:
              - $ref: '#/components/schemas/GasTariff'
              description: Tariffs per payment method (DIRECT_DEBIT_MONTHLY, DIRECT_DEBIT_QUARTERLY, POROB, PREPAYMENT, VARYING)
            title: Payment methods per GSP's group id
          readOnly: true
        sample_quotes:
          allOf:
          - $ref: '#/components/schemas/SampleQuotes'
          readOnly: true
        sample_consumption:
          allOf:
          - $ref: '#/components/schemas/SampleConsumption'
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
          description: Historical charges can be browsed using the provided URLs.
        brand:
          type: string
          readOnly: true
      required:
      - available_from
      - brand
      - code
      - description
      - display_name
      - dual_register_electricity_tariffs
      - four_rate_ev_electricity_tariffs
      - full_name
      - is_restricted
      - links
      - sample_consumption
      - sample_quotes
      - single_register_electricity_tariffs
      - single_register_gas_tariffs
      - tariffs_active_at
    StandardElectricityTariff:
      type: object
      properties:
        code:
          type: string
          maxLength: 255
        standing_charge_exc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        standing_charge_inc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        online_discount_exc_vat:
          type: integer
          readOnly: true
        online_discount_inc_vat:
          type: number
          format: double
          readOnly: true
        dual_fuel_discount_exc_vat:
          type: integer
          readOnly: true
        dual_fuel_discount_inc_vat:
          type: number
          format: double
          readOnly: true
        exit_fees_exc_vat:
          type: integer
          readOnly: true
        exit_fees_inc_vat:
          type: integer
          readOnly: true
        exit_fees_type:
          type: string
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
        standard_unit_rate_exc_vat:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        standard_unit_rate_inc_vat:
          type:
