        rates_agreed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: <p>The datetime the rates were agreed at.</p>
        tariff_code:
          type: string
          description: <p>The code for the agreement tariff. Must match an existing tariff code of an active product.</p>
          x-validators:
          - name: Validate electricity tariff exists
            description: Validate that the provided tariff code has an existing electricity tariff in Kraken.
            possible_errors:
            - tariff_code_not_found
      required:
      - effective_from
      - tariff_code
      x-validators:
      - name: Validate <code>⁨effective_to⁩</code> not before <code>⁨effective_from⁩</code>
        description: Validates that <code>⁨effective_to⁩</code>, if given, is on or later than <code>⁨effective_from⁩</code>.
        possible_errors:
        - start_date_later_than_end_date
      - name: Validate that the rate bands given in the rate overrides are valid for the product code
        description: Validate that the rate bands given in the rate overrides exist for the agreement's product.
        possible_errors:
        - invalid_period
        - rate_band_does_not_exist
      - name: Validate that either <code>register_id</code> or <code>rate_type</code> are provided for bespoke tariff rate registers
        description: Ensure that all registers associated with a bespoke tariff rate have got at least a <code>register_id</code> or a <code>rate_type</code> set.
        possible_errors:
        - no_register_id_or_rate_type_provided_for_bespoke_elec_rate
      - name: Validate effective to provided for end dated electricity product
        description: Validate that the effective to date is provided for an electricity product that has an end date.
        possible_errors:
        - open_ended_agreement_for_end_dated_product
    PaymentSchedule:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: <p>The amount of the payment schedule.</p>
        balance_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: <p>The account balance threshold that triggers a payment for balance-triggered schedules.</p>
        day_of_month:
          type:
          - integer
          - 'null'
          description: <p>The day of the month the payment is due.</p>
          x-validators:
          - name: Validate payment day for payment schedule
            description: Validate that the payment day for a payment schedule is between the configured minimum and maximum allowed payment days in Kraken.
            possible_errors:
            - invalid_payment_day_for_payment_schedule
        debt_repayment_element:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: <p>The contribution to the <code>amount</code> in addition to the regular fixed schedule payment amount.</p><p><code>debt_repayment_element = amount -</code> fixed schedule amount.</p>
        debt_repayment_end_date:
          type: string
          format: date
          description: <p>The date on which the debt repayment will no longer be taken in addition to the regular payment.</p>
        delay_days:
          type: integer
          description: <p>The delay days to configure for the schedule. This configures how many days are delayed when a payment is trigged from a BILL triggered schedule and is therefore only compatible if the trigger = BILL. This is required only if delay_strategy is set.</p>
        delay_strategy:
          enum:
          - FIXED
          - WORKING_DAYS
          type: string
          x-spec-enum-id: 65a4ec07dce09466
          description: <p>The delay days strategy for the schedule. This configures how many days are delayed when a payment is trigged from a BILL triggered schedule and is therefore only compatible if the trigger = BILL</p>
          x-enum-descriptions:
            FIXED: Fixed
            WORKING_DAYS: Working Day
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: <p>The end date for the payment schedule.</p>
        exempt_from_payment_adequacy:
          type: boolean
          default: false
          description: <p>Whether the payment schedule is exempt from payment adequacy or not.</p>
        frequency:
          enum:
          - MONTHLY
          - QUARTERLY
          - WEEKLY
          - FORTNIGHTLY
          - FOUR_WEEKLY
          - ANNUALLY
          - SIX_MONTHLY
          type: string
          x-spec-enum-id: 356d8ee33fff0f54
          description: <p>The frequency of the payment schedule (e.g., WEEKLY, MONTHLY).</p>
          x-enum-descriptions:
            MONTHLY: Monthly
            QUARTERLY: Quarterly
            WEEKLY: Weekly
            FORTNIGHTLY: Fortnightly
            FOUR_WEEKLY: Four-weekly
            ANNUALLY: Annually
            SIX_MONTHLY: Six-monthly
        instalments:
          type: array
          items:
            $ref: '#/components/schemas/Payments'
          description: <p>The instalments of the payment schedule.</p>
          x-validators:
          - name: Validate that each child has a unique combination of values for the <code>⁨payment_date, payment_type⁩</code> fields
            description: Validate that each child has a unique combination of values for the <code>⁨payment_date, payment_type⁩</code> fields.
            possible_errors:
            - children_with_duplicate_values
        is_debt_repayment_plan:
          type: boolean
          default: false
          description: <p>Whether the payment schedule is a debt repayment plan or not.</p>
        ledger_code:
          type: string
          description: <p>The code of the relevant Kraken ledger type for the payment schedule.</p>
          x-validators:
          - name: Validate ledger code
            description: Validates that the ledger code provided in the payload matches an available ledger type in Kraken.
            possible_errors:
            - ledger_code_does_not_exist
        means:
          enum:
          - DD
          - CARD
          - MANUAL
          - PAYMENT_SLIP
          type: string
          x-spec-enum-id: 07a5f0f09deee145
          description: <p>The means of the payment schedule.</p>
          x-enum-descriptions:
            DD: Direct Debit
            CARD: Card
            MANUAL: Manual Payment
            PAYMENT_SLIP: Payment Slip
        paid_by:
          enum:
          - CUSTOMER
          - FUEL_DIRECT
          type: string
          x-spec-enum-id: 30fbefccd8f9d980
          default: CUSTOMER
          description: <p>Who is paying the payments on the schedule.</p>
          x-enum-descriptions:
            CUSTOMER: CUSTOMER
            FUEL_DIRECT: FUEL_DIRECT
        start_date:
          type: string
          format: date
          description: <p>The start date for the payment schedule.</p>
        trigger:
          enum:
          - PLAN
          - REGULAR
          - REGULAR_PLAN
          - BALANCE
          - BILL
          type: string
          x-spec-enum-id: 70fceded34e99681
          description: <p>The trigger for the payment schedule. See choices for more details.</p><p>If not provided we create a  fixed schedule, i.e.  trigger  = REGULAR. A BILL triggered schedule creates a ledger balance clearing payment when a statement or invoice is issued.</p>
          x-enum-descriptions:
            PLAN: Planned collection
            REGULAR: Regular collection
            REGULAR_PLAN: Regular planned collection
            BALANCE: Balance below
            BILL: Bill issued
      required:
      - means
      - start_date
      x-validators:
      - name: Validate <code>⁨end_date⁩</code> not before <code>⁨start_date⁩</code>
        description: Validates that <code>⁨end_date⁩</code>, if given, is on or later than <code>⁨start_date⁩</code>.
        possible_errors:
        - start_date_later_than_end_date
      - name: Validate fixed payment schedule has amount
        description: Validates that a fixed payment schedule has an non zero amount provided in the payload. A fixed schedule is defined as a payment schedule with a trigger that is not type BILL.
        possible_errors:
        - zero_payment_schedule_amount
      - name: Validate regular payment schedule frequency provided
        description: Validates that a fixed regular payment schedule has a frequency provided in the payload.
        possible_errors:
        - fixed_payment_schedule_missing_frequency
      - name: Validate payment schedule balance threshold provided
        description: Validates that a payment schedule with a balance trigger has a balance threshold provided in the payload. This balance threshold is the amount the ledger balance must drop below to trigger a payment.
        possible_errors:
        - balance_triggered_schedule_missing_threshold
      - name: Validate debt repayment end date provided
        description: Validates that a debt repayment end date is provided in the payload if a debt repayment element is provided.
        possible_errors:
        - debt_repayment_missing_end_date
      - name: Validate debt repayment end date is not later than schedule end date
        description: Validates that a debt repayment end date is not later than  the payment schedule end date if both are provided.
        possible_errors:
        - debt_repayment_end_date_after_schedule_end_date
      - name: Validate exempt from payment adequacy is applied only to regular schedule
        description: Validates that only a regular payment schedule is marked as exempted from payment adequacy, so as to create a fixed regular payment schedule.
        possible_errors:
        - invalid_payment_schedule_to_exempt_from_payment_adequacy
      - name: Validate fixed payment schedule has payment day
        description: Validates that a fixed payment schedule has a day of month in the payload. A fixed schedule is defined as a payment schedule with a trigger of type REGULAR.
        possible_errors:
        - fixed_payment_schedule_missing_day_of_month
      - name: Validate instalments is provided if trigger is PLAN
        description: Validate that the instalment field is not empty if payment schedule trigger is PLAN.
        possible_errors:
        - payment_instalments_not_provided
      - name: Validate instalment payment amounts sum to total amount
        description: Validate instalment payment amounts sum to total amount given.
        possible_errors:
        - payment_instalments_do_not_sum_to_total
      - name: Validate instalment payment date is within payment schedule active period
        description: Validate instalment payment date is within the period between start date and end date provided.
        possible_errors:
        - payment_instalments_date_outside_of_payment_schedule_active_period
      - name: Validate that the delayer days is set if delayer strategy is set
        description: Validate that the delayer days is set if delayer strategy is set
        possible_errors:
        - payment_schedule_delay_must_have_bill_trigger
        - payment_schedule_delay_strategy_missing_delay_days
      - name: Validate that the payment amount for fixed payment schedules is within the minor currency unit range of ⁨0⁩ - ⁨upper_bound⁩
        description: Validate that the payment amount for any fixed payment schedule is within the major currency unit range of ⁨lower_limit⁩ - ⁨UNLIMITED⁩.
        possible_errors:
        - fixed_payment_schedule_amount_out_of_range
      - name: Standalone payment request method code is unexpected
        description: Validates that standalone_payment_request_method_code is only provided for MANUAL payment schedules.
        possible_errors:
        - standalone_payment_request_method_code_unexpected
      - name: Standalone payment request method code is valid
        description: Validates that standalone_payment_request_method_code matches a registered method.
        possible_errors:
        - standalone_payment_request_method_code_invalid
    GasMeterPoint:
      type: object
