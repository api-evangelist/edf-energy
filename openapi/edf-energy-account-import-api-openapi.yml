    Debt:
      type: object
      properties:
        aged_debt:
          type: array
          items:
            $ref: '#/components/schemas/AgedDebt'
          description: "<details>\n    <summary>A list of any aged debt on this account.</summary>\n    <p>\n        <p>This is essentially the debt position of the account. Typically we report this based on a\n        grouping by date. We can then report on the delinquency at 30+ or 60+ days etc. As such we\n        need to know when the debt was generated.<p>\n        <p>The data we receive will be converted into a historic record of the debt, which we will\n        continue to age within Kraken.</p>\n        <p>How you report it to Kraken is up to you, the more granular you provide it, the more\n        accurate the debt ageing will be.</p>\n        <p>For example, if debt is £150 and the customer has not paid us £50 a month then we could\n        expect the following:</p>\n        <ul>\n            <li>£50 - 2022-11-01</li>\n            <li>£50 - 2022-10-01</li>\n            <li>£50 - 2022-09-01</li>\n        </ul>\n        <p>We would aggregate in our reporting to:</p>\n        <ul>\n            <li>£50 (0-30 days)</li>\n            <li>£50 (31-60 days)</li>\n            <li>£50 (61-365 days)</li>\n            <li>£0 (365+ days)</li>\n        </ul>\n        <p>In 2 months time (assuming they continue to not pay) this would be:</p>\n        <ul>\n            <li>£50 (0-30 days)</li>\n            <li>£50 (31-60 days)</li>\n            <li>£150 (61-365 days)</li>\n            <li>£0 (365+ days)</li>\n        </ul>\n    </p>\n</details>"
        agency_name:
          type: string
          description: <p>The name of the debt collection agency.</p>
          maxLength: 256
        cais_reference:
          type: string
          description: <p>The CAIS reference for this account.</p>
          x-validators:
          - name: Validate CAIS reference available
            description: Validates that this Kraken instance is configured to support CAIS references and that this reference has not already been provided for an existing account.
            possible_errors:
            - cais_reference_already_in_use_on_another_account
            - cais_references_not_supported
        campaign:
          type: string
          description: <p>The campaign for the debt collection proceeding.</p>
          maxLength: 256
        is_insolvent:
          type: boolean
          default: false
          description: <p>Whether the account is currently insolvent or not.</p>
        notes:
          type: string
          description: <p>The notes for the debt collection proceeding.</p>
          maxLength: 256
        start_date:
          type: string
          format: date
          description: <p>The start date of the debt proceeding. If an <code>agency_name</code> is provided but no <code>start_date</code>, the migration date is used.</p>
      x-validators:
      - name: Validate debt collection agency
        description: Validate that if a start date has been provided, an agency name is also provided, and that agency is supported by Kraken.
        possible_errors:
        - debt_collection_agency_does_not_exist
        - debt_collection_agency_name_required
