        description: Validates that this instance of Kraken allows the complaint type and that the complaint subtype is an allowed subtype of the complain type.
        possible_errors:
        - invalid_complaint_type_or_subtype
      - name: Validate an official complaint's organization and status.
        description: Validates that this instance of Kraken allows the official complaints organization and that the status is configured for the organization.
        possible_errors:
        - invalid_official_organization_or_status
      - name: Validate all required official complaint fields are present
        description: If the complaint is an official complaint, the official reference number, official organization, and official status must all be provided.
        possible_errors:
        - official_complaint_field_missing
      - name: Validate that a CHSR letter has been sent for the complaint
        description: Validates that if an eight week letter has been sent for the complaint, a CHSR letter must have also been sent.
        possible_errors:
        - chsr_letter_not_sent
