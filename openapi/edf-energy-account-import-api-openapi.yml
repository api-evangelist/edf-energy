        start_time:
          type: string
          format: time
          description: <p>The time of day from which this unit rate applies, following the ISO 8601 standard.</p>
        unit_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,5})?$
          description: <p>The value in pence of the charge (excluding VAT).</p>
      required:
      - unit_rate
