        average_monthly_charge:
          type: integer
          minimum: 0
          description: <p>The average monthly charge for the account, if we sum all yearly charges and divide them by 12.</p>
        average_monthly_elec_charge:
          type: integer
          minimum: 0
          description: <p>The average monthly electricity charge for the account, if we sum all yearly charges and divide them by 12.</p>
        average_monthly_gas_charge:
          type: integer
          minimum: 0
          description: <p>The average monthly gas charge for the account, if we sum all yearly charges and divide them by 12.</p>
        balance_adjustment:
          type: integer
          description: <p>The adjustment on top of the average monthly charge, to be used as the new direct debit payment. This can be 0 if the difference between current and target balance is small enough to not act on.</p>
        created_at:
          type: string
          format: date-time
          description: <p>The datetime the payment adequacy change was created.</p>
          x-validators:
          - name: Validate payment adequacy change created in past
            description: Validates that the payment adequacy change created at date provided is not in the future.
            possible_errors:
            - payment_adequacy_invalid_dates
        current_balance:
          type: integer
          description: <p>The account balance at the date of the payment adequacy run.</p>
        existing_direct_debit_payment:
          type: integer
          minimum: 0
          description: <p>The existing Direct Debit payment amount at the time of review.</p>
        ledger:
          allOf:
          - $ref: '#/components/schemas/Ledger'
          description: <p>The ledger for the payment adequacy change. The ledger must already exist in Kraken.</p>
        new_direct_debit:
          type: integer
          minimum: 0
          description: <p>The recommended Direct Debit payment amount.</p>
        should_not_be_applied_reason:
          type:
          - string
          - 'null'
          description: <p>The reason why the payment adequacy change was not applied. This should be <code>null</code> if the payment adequacy change was applied.</p>
          maxLength: 512
        target_balance:
          type: integer
          description: <p>The target balance for the account after 12 months.</p>
