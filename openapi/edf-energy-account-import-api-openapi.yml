          description: <p>Whether the customer has been sent an eight week letter for the complaint.</p>
        official_entity:
          type: string
          description: <p>The official organization of the complaint if it is an official complaint.</p>
        official_reference_number:
          type: string
          description: <p>The official reference number of the complaint if it is an official complaint.</p>
        official_status:
          type: string
          description: <p>The official status of the complaint if it is an official complaint.</p>
        subtype_of_complaint:
