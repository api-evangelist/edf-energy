- aid: edf-energy:edf-kraken-customer-migration-api
  name: EDF Kraken Customer Migration (Data Import) API
  description: >-
    A second, separately published first-party OpenAPI 3.0.3 document describing the Kraken
    customer-migration API, harvested verbatim from https://api.edfgb-kraken.energy/data-import/schema/
    at HTTP 200 on 2026-07-27 with no credentials — 16 paths and 139 component schemas. It is the
    machine-readable expression of how a customer book moves between suppliers onto Kraken:
    account import processes are created, validated and processed, transfer status is polled per
    external account number, and historical statements, transactions, notes and payment
    instructions are imported, all keyed by an import_supplier_code. This is the operational
    counterpart to the fact that EDF itself migrated 5.8 million accounts onto this platform in
    fifteen months. It is a partner-facing contract: the endpoints require authentication, and
    a developer needs a migration relationship with EDF rather than a signup form.
