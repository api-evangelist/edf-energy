- aid: edf-energy:edf-kraken-rest-api
  name: EDF Kraken REST API
  description: >-
    The REST half of EDF's Kraken platform API, described by a first-party OpenAPI 3.0.3
    document that EDF serves itself at https://api.edfgb-kraken.energy/v1/schema?namespaces=default
    and renders through ReDoc on its developer portal. Harvested verbatim on 2026-07-27 at HTTP
    200 with no credentials: 27 paths and 57 component schemas covering energy products and
    their electricity and gas tariffs (day, night, standard, off-peak and peak EV unit rates and
    standing charges), grid supply points, electricity and gas meter point consumption, account
    creation, tariff renewal, quotes and payment intents. Access is split inside the same
    document: /v1/products/ carries an empty security option and returned HTTP 200 anonymously
    with 21 live EDF products, and /v1/industry/grid-supply-points/ resolved a postcode to GSP
    group _C anonymously, while /v1/electricity-meter-points/{mpan}/ and the consumption
    endpoints require KeyAuthentication ("Authorization: Token ...") or a Kraken JWT. Five
    security schemes are declared: AccountUserAPIKeyAuthentication, AffiliateAuthentication,
    DRFKrakenTokenAuthentication, KeyAuthentication and PartnerUserOnlyAuthentication.
