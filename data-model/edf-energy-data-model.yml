industry_identifiers:
- id: MPAN
  meaning: >-
    Meter Point Administration Number — the national identifier for a GB electricity
    supply point. Path parameter on /v1/electricity-meter-points/{mpan}/.
- id: MPRN
  meaning: >-
    Meter Point Reference Number — the national identifier for a GB gas supply point.
    Path parameter on /v1/gas-meter-points/{mprn}/.
- id: GSP group
  meaning: >-
    Grid Supply Point group — the regional distribution zone a postcode resolves to;
    determines regional unit rates.
- id: import_supplier_code
  meaning: >-
    The migration-side identifier for the losing supplier whose customer book is being
    imported.
graphql_note: >-
  The GraphQL schema is a much wider projection of the same core — 2,492 types adding
  smart-meter telemetry, SmartFlex/EV device families, heat pumps, loyalty points,
  collection processes, ledgers, complaints and property/portfolio structures that have
  no REST equivalent. This graph documents the REST-expressed core; see
  mcp/edf-energy-tool-crosswalk.yml for the surface divergence.
