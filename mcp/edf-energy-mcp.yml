  octopus-energy, krakenflex) and the MCP registries on 2026-07-27 — nothing EDF-published. Third-party
  community MCP servers do exist for the Octopus Energy branding of the same Kraken platform (tako-mcp,
  octopus-energy-mcp, @pipeworx/mcp-octopus-energy on npm), which is evidence the platform is agent-attractive,
  but none of them target EDF GB and none are first-party. What follows is therefore a CANDIDATE tool
  surface derived one-for-one from the operationIds in EDF''s own two OpenAPI documents: each tool''s
  real input schema is that operation''s parameters and requestBody in the spec. Three schema-serving
  meta endpoints are excluded. The far larger GraphQL surface (246 queries, 417 mutations) is deliberately
  not expanded into tools here — see mcp/edf-energy-tool-crosswalk.yml for how the two surfaces diverge.'
