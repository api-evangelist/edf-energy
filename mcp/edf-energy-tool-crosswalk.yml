graphql_only:
- capability: Smart-meter telemetry and consent
  fields: [smartMeterTelemetry, smartMeterDataPreferences, readingConsentGranularity, settableConsentGranularities, estimatedSupplyPointReadings]
  reason: >-
    No REST expression. Granular half-hourly telemetry and the consent granularity a
    customer has granted are GraphQL-only, and are the most consequential consumer-data
    surface EDF exposes. Gated behind a customer token or the request:consumption-data /
    update:smart-meter-data-preferences OAuth scopes.
- capability: SmartFlex, EV charging and device control
  fields: [flexPlannedDispatches, plannedDispatches, completedDispatches, vehicleChargingPreferences, costOfCharge, flexSupportedDevices, smartFlexDeviceSupplyPoint, smartFlexOnboardingWizards, devices, eligibleDeviceTypes, ocppConnection, ocppDetails, batteryDevice, registeredKrakenflexDevice]
  reason: >-
    Demand-flexibility and physical device control — dispatching a charge, reading a
    planned dispatch schedule, OCPP charge-point state. Entirely GraphQL, entirely
    absent from the OpenAPI, and the highest-consequence surface for an autonomous agent.
- capability: Heat pumps and low-carbon assets
  fields: [mcsInstallations, segInstallation, fitInstallations, fitSchedule, customerAsset, chargePointVariants, batteryVariants, electricVehicles]
  reason: Generation, export (SEG/FIT) and heating assets; no REST counterpart.
- capability: Prepay and ledgers
  fields: [electricityPrepayLedgers, gasPrepayLedgers, prepayBalanceSnapshot, prepayPayments, autoTopupConfigs, autoTopupTriggers]
  reason: Prepayment metering and top-up; REST has no ledger surface.
- capability: Billing, debt and payment adequacy
  fields: [accountDebtPosition, livePaymentAdequacy, livePaymentAdequacyCalculation, paymentPlanDetails, collectionProcessDetails, depositAgreements, returnSchedule]
  reason: Credit and collections; REST stops at the Stripe payment intent.
- capability: Loyalty, campaigns and rewards
  fields: [loyaltyPointsBalance, loyaltyPointLedgers, loyaltyPointLedgerEntry, loyaltyCards, campaigns, activeCampaignOffers, vouchersForAccount, vouchersBalanceDetail]
  reason: Engagement mechanics; no REST expression.
- capability: Complaints, contact centre and conversations
  fields: [complaint, calls, callTranscripts, callRecordingDetail, inkConversation, inkLiveChatConversations, inkMessage, customerFeedbackForms]
  reason: Service operations; REST exposes only two Twilio callback endpoints.
- capability: Property, portfolio and multi-site
  fields: [property, properties, propertySearch, propertiesSearch, portfolio, portfolioByReference, supplyPoint, supplyPoints, meterPoints, occupierAccount, embeddedNetwork]
  reason: The multi-site / C&I model, which is also what drives dynamic rate-limit scaling.
- capability: Field service and appointments
  fields: [siteworksAppointmentSlots, siteworksRequests, getOnSiteJobsAppointmentSlots, getOnSiteJobsRequests, getOnSiteJobsJobTypes, workSchedule]
  reason: Engineer visits and metering works; REST has none of it.
- capability: Platform introspection and governance
  fields: [rateLimitInfo, queryComplexity, possibleErrors, apiBrownouts, krakenVersion, authorizedApplications, apiExceptions]
  reason: >-
    Self-describing runtime governance — an agent can read its own remaining points
    budget, a query's complexity cost and a field's possible errors before executing.
    There is no REST equivalent, which makes GraphQL the only self-governing surface.
- capability: Fraud, identity and validation
  fields: [fraudMeterPointChecks, fraudRiskLevel, paymentFingerprintChecks, bankDetailsValidation, validateBankAccount, verificationStatus, mfaDevices, leadBlocklistValidations]
  reason: Risk controls; REST exposes none.
rest_only:
- capability: Customer migration / data import
  operations: ['V1 Create Or Update Account Import Process', 'V1 Validate Account', 'V1 Process Account Import Process', 'V1 Get Account Transfer Status', 'V1 Get All Account Import Processes', 'V1 Get Pending Account Import Processes', 'V1 Get Imported Accounts', 'V1 Get Meter Point Statuses For Account', 'V1 Create Historical Statements', 'V1 Create Transactions', 'V1 Create Account Notes', 'V1 Create Payment Instruction', 'V1 Send Registration Flows', 'V2 Schedule Account Creation', 'V2 Validate Account', 'V2 Account Import Status']
  reason: >-
    The entire 16-operation migration API is REST-only and has no GraphQL expression.
    This is the contract by which a customer book is moved onto Kraken — the operational
    counterpart to EDF migrating 5.8 million accounts in fifteen months.
- capability: Direct per-tariff rate collections
  operations: ['Electricity Tariff Day Unit Rates', 'Electricity Tariff Night Unit Rates', 'Electricity Tariff Ev Device Peak Unit Rates', 'Electricity Tariff Ev Device Off Peak Unit Rates', 'Electricity Tariff Standing Charges', 'Gas Tariff Standard Unit Rates', 'Gas Tariff Standing Charges']
  reason: >-
    Anonymous, directly addressable per-tariff price collections. GraphQL reaches rates
    only through the customer-scoped agreement/applicable-rate path, so these are the
    only anonymous machine-readable price feeds EDF publishes.
- capability: Stripe payment intents
  operations: ['Create a Stripe payment intent', 'Confirm a Stripe payment intent', 'Mark a Stripe payment intent as failed']
  reason: The Stripe integration lifecycle is REST-only.
- capability: Twilio voice callbacks
  operations: ['Twilio Enqueue Audio', 'Voice Announcement']
  reason: Telephony webhooks consumed by Twilio, not an agent-facing surface.
