  mcp/edf-energy-mcp.yml (candidate tools derived from the two OpenAPI documents),
  openapi/edf-energy-kraken-openapi.yml, openapi/edf-energy-kraken-data-import-openapi.yml,
  and graphql/edf-energy-schema.graphql (harvested by anonymous introspection 2026-07-27).
description: >-
  EDF Energy runs two overlapping-but-non-identical projections of one Kraken data core,
  and neither is a superset of the other. REST exposes 43 operations across two documents.
  GraphQL exposes 246 Query fields and 417 Mutation fields over the same core. This
  crosswalk binds them, so a tool built on either surface inherits a real input contract
  instead of a guessed one. The headline divergence is enormous and asymmetric: almost
  every REST operation has a GraphQL equivalent, but the overwhelming majority of the
  GraphQL surface — smart-meter telemetry, SmartFlex and EV device control, heat pumps,
  prepay ledgers, loyalty points, complaints, collection processes, property portfolios,
  on-site jobs and appointments — has no REST expression at all. An agent restricted to
  the OpenAPI sees the tariff shop-window; an agent on GraphQL sees the customer's energy
  life. The exception runs the other way: the entire customer-migration API is REST-only,
  and every unit-rate/standing-charge collection is addressed more directly in REST than
  through the GraphQL product tree.
