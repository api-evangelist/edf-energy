mcp_only_note: >-
  No MCP server is published, so there are no MCP-only tools. If EDF or Kraken ever ship
  one, the GraphQL-only capabilities above are where the divergence will land.
idempotency_note: >-
  Another asymmetry worth binding: idempotency exists only on the GraphQL side, as an
  idempotencyKey input field on money-moving and ledger mutations (errors KT-CT-3928,
  KT-CT-9221). No REST operation accepts an idempotency key, including the Stripe
  payment-intent triple. See conventions/edf-energy-conventions.yml.
