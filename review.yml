findings:
  summary: >-
    EDF Energy is the counter-example this study needs. Every other tier in the energy sector tests
    whether a mandate produced an implementation; EDF tests what happens when there is no mandate at
    all. Great Britain never created a consumer energy data right. It created a licensed
    smart-metering monopoly instead, which moves data between industry parties and gives a developer
    nothing. By the logic that explains the mandated markets, EDF should have no API. It has one of
    the better utility APIs in Europe — a public developer portal, two first-party OpenAPI 3.0.3
    documents, a 2,492-type GraphQL schema that anyone can introspect anonymously, a maintained
    deprecation changelog, published rate limits, and an OpenID Connect server advertising 111
    scopes with consent granularity as a modelled concept. The explanation is not virtue and it is
    not regulation: EDF rents the API. In 2023 it licensed Kraken from Octopus Energy Group and
    migrated 5.8 million customer accounts in fifteen months, and what is documented at
    developer.edfgb-kraken.energy is the platform's contract with EDF's logo on it. Britain's
    unusual result is that competitive pressure from one API-native supplier propagated an API into
    its incumbent competitors by commercial licence, faster and further than a statute did in
    Australia. The split inside EDF is then the reverse of the mandated pattern: tariff and product
    data is wide open and EDF serves it itself with no key at all, while consumer data is documented
    but gated by an account or a partner relationship — and the market data EDF is legally obliged
    to disclose is where its own machine-readable channel is broken, with the XML and CSV export
    links on its REMIT page both returning 404 and the working feed living on Elexon's API instead.
  mandateIsNotImplementation: >-
    Recorded as separate facts, in the direction this provider actually runs. Mandate: none for
    consumer data; infrastructure-only via the Smart DCC, unverifiable from a public register
    because the Smart Energy Code Company returns 403 to machines, and therefore claimed only as
    the legal position and not as a verified registration. Implementation: extensive, and verified
    by calling it — HTTP 200 on the portal, both specs downloaded and parsed, the GraphQL schema
    introspected in full, live tariffs returned anonymously, the OIDC document retrieved. The only
    EDF claim that failed verification was its own REMIT export links.
  contrastWithMandatedMarkets: >-
    Against a designated Australian CDR energy retailer, EDF publishes more and gates it less: base
    URIs are published rather than distributed through a register, the schema is introspectable by
    anyone rather than reproduced from a standards body, there is no accreditation, and the auth is
    ordinary OAuth 2.0 with client_secret_basic rather than FAPI 1.0 Advanced with mTLS and
    private_key_jwt. What EDF lacks is exactly what the mandate guarantees and the platform does
    not: a legal right for a consumer to compel the transfer, an accreditation regime that makes
    third-party access a rule rather than a favour, and a standard shape that is identical across
    suppliers. EDF's API is better to use and weaker to rely on.
  platformDependency: >-
    Worth recording plainly. EDF Energy's entire public API programme is hosted on
    *.edfgb-kraken.energy, a domain EDF does not own the platform of. Its own domains resolve
    nothing developer-facing; api.edfenergy.com times out; its GitHub organization has two
    unrelated repositories. If the Kraken licence ended, EDF's API would end with it. The same is
    now true of Good Energy and E.ON Next, and of AGL in Australia via Kaluza — the retail data
    layer across multiple markets is consolidating onto a small number of licensed platforms, and
    the API surface consolidates with it.

