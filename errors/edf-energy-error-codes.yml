format: kraken-graphql-error-extensions
description: >-
  EDF Energy's published error-code registry, harvested verbatim from the Error Codes
  page of the EDF GB Kraken GraphQL reference (HTTP 200, anonymous, 2026-07-27). This
  is the non-payments sibling of a decline-code catalog: 1370 distinct KT-CT-* codes, each
  with an errorType and an errorDescription, which is one of the largest published error
  registries in the API Evangelist catalog. It is not RFC 9457 — Kraken does not use
  application/problem+json. Per the GraphQL basics guide the GraphQL API "will always
  return a 200 response code, assuming the server is available", and errors are carried
  in the JSON "errors" array with an extensions object holding errorType, errorCode and
  errorDescription. The REST half of the platform uses conventional HTTP status codes;
  see errors/edf-energy-problem-types.yml for those.
envelope:
  transport: HTTP 200 for GraphQL (errors are in-body, not in the status line)
  path: errors[].extensions
  fields:
    errorType: >-
      One of VALIDATION, NOT_FOUND, APPLICATION, AUTHORIZATION, SERVICE_AVAILABILITY
    errorCode: The KT-CT-* identifier
    errorDescription: Human-readable explanation
  example: |
    {"errors": [
      {
        "message": "'Authorization' header not provided.",
        "extensions": {
          "errorType": "AUTHORIZATION",
          "errorCode": "KT-CT-1112",
          "errorDescription": "You must provide the AUTHORIZATION header while executing the query/mutation."
        }
      }
    ]}
  note: >-
    Per-field error documentation is also available: the possible errors a query or
    mutation can raise are listed in that field's description in the GraphQL reference
    and in the "Possible errors" tab of the GraphQL IDE, and are present verbatim in
    graphql/edf-energy-schema.graphql.
