source: >-
  https://developer.edfgb-kraken.energy/announcements/ (HTTP 200),
  https://developer.edfgb-kraken.energy/graphql/changelog/ (HTTP 200),
  https://developer.edfgb-kraken.energy/graphql/guides/basics/ (HTTP 200),
  https://announcements.kraken.tech/ (HTTP 200); deprecated fields derived from
