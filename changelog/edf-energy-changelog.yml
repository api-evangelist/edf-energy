description: 'EDF Energy publishes two distinct dated change feeds for the EDF GB Kraken API, both fully
  public and anonymous. The first is a machine-generated GraphQL schema changelog: 1249 individually timestamped
  schema releases across 409 distinct days, from July 27, 2026 back to September 08, 2024, recording 4843
  schema deltas (3037 additions, 1242 removals, 564 other changes) at the granularity of a single type,
  field, input field, argument or enum value. That averages about twelve schema deltas on each day that had
  a release, on a continuously-evolving unversioned schema — and 1,242 of those deltas are removals, which
  is why the deprecation-date discipline in lifecycle/ matters as much as it does. The second feed is a
  curated announcements list of 59 posts covering breaking changes
  and new features, each with a publication date, an Action Required flag where relevant, and a named
  removal date — with an RSS feed and an email subscription. There is no equivalent changelog for the
  REST API.'
scheme: continuous — the GraphQL schema is unversioned and changes are published per release, not per
  version
current_version: v1 (REST path version); GraphQL schema is unversioned
